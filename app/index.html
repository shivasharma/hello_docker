<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Login - SB Admin</title>
        <link href="css/styles.css" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.1.0/js/all.js" crossorigin="anonymous"></script>
    </head>
    <body class="bg-primary">
        <div id="layoutAuthentication">
            <div id="layoutAuthentication_content">
                <main>
                    <div class="container">
                        <div class="row justify-content-center">
                            <div class="col-lg-5">
                                <div class="card shadow-lg border-0 rounded-lg mt-5">
                                    <div class="card-header"><h3 class="text-center font-weight-light my-4">Login</h3></div>
                                    <div class="card-body">
                                        <form id="loginForm" novalidate>
                                            <div class="form-floating mb-3">
                                                <input class="form-control" id="inputUsername" type="text" placeholder="Username" />
                                                <label for="inputUsername">Username</label>
                                            </div>
                                            <div class="form-floating mb-3">
                                                <input class="form-control" id="inputPassword" type="password" placeholder="Password" />
                                                <label for="inputPassword">Password</label>
                                            </div>
                                            <div id="loginValidationMessage" class="alert alert-danger d-none" role="alert" aria-live="polite">
                                                Please enter both username and password to log in.
                                            </div>
                                            <div class="form-check mb-3">
                                                <input class="form-check-input" id="inputRememberPassword" type="checkbox" value="" />
                                                <label class="form-check-label" for="inputRememberPassword">Remember Password</label>
                                            </div>
                                            <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                                                <a class="small" href="password.html">Forgot Password?</a>
                                                <button class="btn btn-primary" type="submit">Login</button>
                                            </div>
                                        </form>
                                    </div>
                                    <div class="card-footer text-center py-3">
                                        <div class="small"><a href="register.html">Need an account? Sign up!</a></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
            <div id="layoutAuthentication_footer">
                <footer class="py-4 bg-light mt-auto">
                    <div class="container-fluid px-4">
                        <div class="d-flex align-items-center justify-content-between small">
                            <div class="text-muted">Copyright &copy; Your Website 2022</div>
                            <div>
                                <a href="#">Privacy Policy</a>
                                &middot;
                                <a href="#">Terms &amp; Conditions</a>
                            </div>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="js/scripts.js"></script>
        <script>
            const loginForm = document.getElementById('loginForm');
            const usernameInput = document.getElementById('inputUsername');
            const passwordInput = document.getElementById('inputPassword');
            const validationMessage = document.getElementById('loginValidationMessage');
            const defaultUsername = 'admin';
            const defaultPassword = 'admin';

            function clearFieldError(inputElement) {
                if (inputElement.value.trim() !== '') {
                    inputElement.classList.remove('is-invalid');
                }
            }

            usernameInput.addEventListener('input', function () {
                clearFieldError(usernameInput);
                if (usernameInput.value.trim() !== '' && passwordInput.value.trim() !== '') {
                    validationMessage.classList.add('d-none');
                }
            });

            passwordInput.addEventListener('input', function () {
                clearFieldError(passwordInput);
                if (usernameInput.value.trim() !== '' && passwordInput.value.trim() !== '') {
                    validationMessage.classList.add('d-none');
                }
            });

            loginForm.addEventListener('submit', function (event) {
                event.preventDefault();

                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                if (username === '' || password === '') {
                    validationMessage.textContent = 'Please enter both username and password to log in.';
                    validationMessage.classList.remove('d-none');

                    if (username === '') {
                        usernameInput.classList.add('is-invalid');
                    }

                    if (password === '') {
                        passwordInput.classList.add('is-invalid');
                    }

                    return;
                }

                if (username !== defaultUsername || password !== defaultPassword) {
                    validationMessage.textContent = 'Invalid credentials. Use username admin and password admin.';
                    validationMessage.classList.remove('d-none');
                    usernameInput.classList.add('is-invalid');
                    passwordInput.classList.add('is-invalid');
                    return;
                }

                window.location.href = 'index.html';
            });
        </script>
    </body>
</html>
